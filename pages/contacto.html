<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Brunella Outlet</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <!-- Acceso al CSS externo subiendo un nivel -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- HEADER Y NAVEGACIÓN -->
    <header class="header">
        <div class="logo-container">
            <a href="../index.html">
                <img src="../img/logo.png" alt="Logo Brunella Accesorios" class="logo-img">
            </a>
        </div>
        <nav class="nav">
            <ul class="nav-list">
                <!-- Rutas relativas para ir y volver con ../ -->
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="../index.html#productos" class="nav-link">Productos</a></li>
                <li><a href="../index.html#video-seccion" class="nav-link">Video</a></li>
                <li><a href="../index.html#resenas" class="nav-link">Opiniones</a></li>
                <li><a href="./contacto.html" class="nav-link activo">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacto-main">
        <section class="contacto-section">
            <h1 class="seccion-titulo">Contactate con Brunella</h1>
            <p class="subtitulo-seccion">¿Tenés dudas sobre las medidas de los anillos o querés hacer un pedido? Envianos tu consulta y te responderemos enseguida.</p>

            <!-- Formulario conectado a Formspree -->
            <form action="https://formspree.io/f/xbjnqkyk" method="POST" class="formulario-contacto">
                <div class="campo-grupo">
                    <label for="nombre">Nombre y Apellido:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="_replyto" placeholder="nombre@correo.com" required>
                </div>

                <div class="campo-grupo">
                    <label for="producto-interes">¿Qué accesorio te interesa?:</label>
                    <select id="producto-interes" name="producto">
                        <option value="anillos">Anillos de Plata 925</option>
                        <option value="cuffs">Cuffs de Plata (sin perforación)</option>
                        <option value="collares">Collares y Cadenas</option>
                        <option value="otro">Otras consultas</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensaje">Consulta:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí aquí tu mensaje o duda sobre stock..." required></textarea>
                </div>

                <button type="submit" class="btn btn-form">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Brunella Outlet. Todos los derechos reservados.</p>
        <p>Instagram: <strong>@brunella.outlet</strong></p>
    </footer>

</body>
</html>
